# =============================================================================
# AI Exception Explainer - Backend Configuration
# =============================================================================

# --- Server -----------------------------------------------------------------
server.port=8080

# --- Application ------------------------------------------------------------
spring.application.name=exception-explainer-backend

# --- AI Provider Configuration ----------------------------------------------
# Default provider used when a request does not specify one.
ai.default-provider=ollama

# --- Ollama Configuration ---------------------------------------------------
# Base URL of the Ollama server. Change this if Ollama runs on a remote host.
ollama.base-url=http://localhost:11434

# Optional fallback model. The frontend discovers installed models via
# GET /api/models, so this is only used when a request carries no model.
ollama.model=

# Maximum time (ms) to wait for Ollama to complete an analysis.
ollama.timeout-ms=120000

# Maximum tokens to generate in the response.
ollama.max-tokens=2048

# Temperature: lower = more deterministic output. Keep between 0.0 and 1.0.
ollama.temperature=0.2

# --- Groq Configuration -----------------------------------------------------
# Groq uses an OpenAI-compatible chat completions API. The API key is read from
# the GROQ_API_KEY environment variable and is NEVER exposed to the frontend.
groq.base-url=https://api.groq.com/openai/v1
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-120b
groq.timeout-ms=120000
groq.max-tokens=2048
groq.temperature=0.2

# --- Analysis ---------------------------------------------------------------
# Maximum number of models allowed in a single comparison request.
app.max-compare-models=4

# --- File Upload ------------------------------------------------------------
# Allowed file extensions for the /api/analyze/file endpoint.
app.allowed-file-extensions=.txt,.log,.json,.md,.csv,.sql,.java,.py,.js,.ts,.html,.xml,.yml,.yaml,.properties,.pdf

# Max upload size.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- CORS -------------------------------------------------------------------
# Allowed origins for the frontend dev server.
app.cors.allowed-origins=http://localhost:5173

# --- Logging ----------------------------------------------------------------
logging.level.com.aiexception.explainer=INFO
