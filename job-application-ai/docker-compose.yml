version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobappai-postgres
    environment:
      POSTGRES_USER: jobappai
      POSTGRES_PASSWORD: jobappai
      POSTGRES_DB: jobappai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobappai -d jobappai"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jobappai-migrate
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jobappai:jobappai@postgres:5432/jobappai
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node ./scripts/tsx-runner.mjs prisma/seed.ts
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jobappai-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://jobappai:jobappai@postgres:5432/jobappai
      FRONTEND_URL: http://localhost:5173
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      TARGET_RESUME_SCORE: ${TARGET_RESUME_SCORE:-85}
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-2000}
    ports:
      - "3001:3001"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jobappai-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
