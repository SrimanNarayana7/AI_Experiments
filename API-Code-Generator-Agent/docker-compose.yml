services:
  db:
    image: postgres:16-alpine
    container_name: api-code-generator-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_code_generator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_code_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
